<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles.css" />
    <title>Posts</title>
</head>

<body class="bg-background">
    <nav class="navbar navbar-expand-lg bg-primary shadow-sm">
        <div class="container">
            <a class="text-light text-decoration-none fw-bold" href="../index.html">Cooking Blog</a>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link active" href="../index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="posts.html">Посты</a></li>
                    <li class="nav-item"><a class="nav-link" href="../about/about.html">О нас</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="position-fixed bottom-0 end-0 p-4">
        <a id="showPopupBtn"
            class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center shadow add-post-button">
            +
        </a>
    </div>

    <div id="postViewer">
        <button id="closeViewerBtn" class="closeViewBtn">X</button>
        <div class="post-view-bg">
            <div>
                <button id="deletePostBtn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                        fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                        <path
                            d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z" />
                        <path
                            d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z" />
                    </svg></button>
                <button id="editPostBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-pencil" viewBox="0 0 16 16">
                        <path
                            d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325" />
                    </svg>
                </button>
            </div>
            <div class="post-meta mt-1">
                <p class="text-muted" id="postCreated"></p>
                <p class="text-muted" id="postUpdated"></p>
            </div>
            <h1 id="postTitle" class="text-light">default title</h1>
            <p id="postDescription" class="text-light">default desc</p>
        </div>

    </div>

    <div id="postUpdater">
        <button id="closeUpdaterBtn" class="closeViewBtn">X</button>
        <form>
            <div class="mb-3">
                <label class="card-text">Title</label>
                <input class="form-control" id="inputTitleUpdater">
            </div>
            <div class="mb-3">
                <label class="card-text">Description</label>
                <textarea class="form-control" id="inputDescriptionUpdater" rows="5"></textarea>
            </div>
            <button id="submitPostUpdateBtn" type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <div id="postCreator">
        <button id="closeCreatorBtn" class="closeViewBtn">X</button>
        <form>
            <div class="mb-3">
                <label class="card-text">Title</label>
                <input class="form-control" id="inputTitle">
            </div>
            <div class="mb-3">
                <label class="card-text">Description</label>
                <textarea class="form-control" id="inputDescription" rows="5"></textarea>
            </div>
            <button id="submitNewPostBtn" type="submit" class="btn btn-primary">Submit</button>
            <button id="submitPostUpdateBtn" type="submit" class="btn btn-primary"
                style="display: none;">Submit</button>
        </form>
    </div>


    <div class="container mt-4">
        <div class="mb-3 d-flex align-items-center">
            <label for="inputTags" class="form-label text-light mb-0 me-2">
                Tags (separate with comma):
            </label>
            <input type="text" id="inputTags" class="form-control w-auto flex-grow-1"
                placeholder="e.g. asian, quick, easy">
        </div>
        <div id="pager" class="d-flex justify-content-end align-items-center mb-2">
            <button id="prevPage" class="btn btn-sm btn-outline-light px-2 me-2">&lt;</button>
            <span id="pageNumber" class="text-light small">1</span>
            <button id="nextPage" class="btn btn-sm btn-outline-light px-2 ms-2">&gt;</button>
        </div>
    </div>
    <div class="container mt-5">
        <div id="postsContainer" class="row g-4"></div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="posts.js"></script>
</body>

</html>
